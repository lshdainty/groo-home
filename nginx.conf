server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 한글 페이지다 — Content-Type 에 charset 을 박아 브라우저가 UTF-8 로 읽게 한다
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # /ieum 처럼 끝 슬래시가 없는 주소는 /ieum/ 으로 보낸다 — 컨테이너는 엣지 nginx 뒤 8080 이라
    # 절대 주소로 보내면 포트(:8080)가 새어 나간다. 상대 주소로 보낸다.
    absolute_redirect off;

    # ── 보안 헤더(보안 점검 INF-9) ─────────────────────────────────────────────
    # nginx 함정: location 안에 add_header 가 **하나라도** 있으면 server 의 add_header 를
    # 물려받지 않는다. 그래서 add_header 를 쓰는 location 마다 같은 줄을 다시 적는다 —
    # 한 곳이라도 빠뜨리면 그 응답에는 보안 헤더가 하나도 안 붙는다.
    #  · Referrer-Policy 는 strict-origin-when-cross-origin 이어야 한다. no-referrer · same-origin 으로
    #    조이면 sso 로그아웃 화면이 직전 페이지(우리 사이트)를 못 알아봐 매번 확인 화면을 띄운다.
    #  · 스크립트 CSP(script-src)는 아직 넣지 않는다(후속) — 여기 CSP 는 frame-ancestors 하나뿐이다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 서비스 소개는 디렉터리(/ieum/, /damda/)다. 그 밖의 경로는 그루 소개(index.html)로 보낸다
    # (옛 링크·오타가 hr 로 새던 것을 여기서 받는다)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 화면 캡처·사진은 오래 캐시한다 — 바뀌면 파일명이 아니라 배포로 갈리므로 하루면 충분하다
    location ~ ^/(img|css|js)/ {
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 페이지(index.html)는 캐시하지 않는다 — 배포 직후 바로 바뀌어야 한다
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
}
