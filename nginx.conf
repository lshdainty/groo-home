server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 한글 페이지다 — Content-Type 에 charset 을 박아 브라우저가 UTF-8 로 읽게 한다
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;

    # /ieum 처럼 끝 슬래시가 없는 주소는 /ieum/ 으로 보낸다 — 컨테이너는 엣지 nginx 뒤 8080 이라
    # 절대 주소로 보내면 포트(:8080)가 새어 나간다. 상대 주소로 보낸다.
    absolute_redirect off;

    # 서비스 소개는 디렉터리(/ieum/, /damda/)다. 그 밖의 경로는 그루 소개(index.html)로 보낸다
    # (옛 링크·오타가 hr 로 새던 것을 여기서 받는다)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 화면 캡처·사진은 오래 캐시한다 — 바뀌면 파일명이 아니라 배포로 갈리므로 하루면 충분하다
    location ~ ^/(img|css|js)/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # 페이지(index.html)는 캐시하지 않는다 — 배포 직후 바로 바뀌어야 한다
    location ~ /index\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
